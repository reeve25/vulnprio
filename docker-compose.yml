services:
  localstack:
    # 4.14 is the newest tag that runs without an auth token (see DECISIONS.md #13)
    image: localstack/localstack:4.14
    ports: ["4566:4566"]
    environment:
      SERVICES: s3,dynamodb
    volumes:
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init.sh:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "awslocal dynamodb describe-table --table-name vulnprio && awslocal s3api head-bucket --bucket vulnprio-raw"]
      interval: 3s
      retries: 30

  api:
    build: .
    ports: ["8080:8080"]
    environment:
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test  # LocalStack accepts any credentials
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      VULNPRIO_TABLE: vulnprio
      VULNPRIO_BUCKET: vulnprio-raw
    depends_on:
      localstack:
        condition: service_healthy
